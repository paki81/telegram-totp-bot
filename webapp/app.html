<!-- sfondo liquido animato -->
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="grain"></span>
</div>

<!-- gradiente condiviso per gli anelli countdown -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="stop-a"/>
      <stop offset="100%" class="stop-b"/>
    </linearGradient>
  </defs>
</svg>

<main class="wrap">
  <header class="top glass">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>
      </div>
      <div class="brand-text">
        <h1>Codici 2FA</h1>
        <p id="subtitle">Caricamento…</p>
      </div>
    </div>
    <button class="icon-btn glass-btn" id="themeBtn" aria-label="Cambia tema">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 10.7C22 5.9 17.5 2 12 2z"/></svg>
    </button>
  </header>

  <div class="themes glass" id="themes" hidden>
    <button data-theme="auto"><span class="sw sw-auto"></span>Auto</button>
    <button data-theme="aurora"><span class="sw sw-aurora"></span>Aurora</button>
    <button data-theme="sky"><span class="sw sw-sky"></span>Cielo</button>
    <button data-theme="peach"><span class="sw sw-peach"></span>Pesca</button>
    <button data-theme="mint"><span class="sw sw-mint"></span>Menta</button>
    <button data-theme="pearl"><span class="sw sw-pearl"></span>Perla</button>
    <button data-theme="midnight"><span class="sw sw-midnight"></span>Notte</button>
  </div>

  <label class="search glass">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Cerca account" autocomplete="off">
  </label>

  <!-- filtro categorie -->
  <div class="chips" id="chips"></div>

  <section class="panel glass" id="qrText" hidden>
    <div class="panel-title">📷 Contenuto del QR</div>
    <code id="qrTextContent"></code>
    <div class="row">
      <button class="btn ghost" id="qrTextClose">Chiudi</button>
    </div>
  </section>

  <section id="list" class="list"></section>
</main>

<nav class="dock glass">
  <button id="scanBtn" class="dock-btn primary">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
    <span>Scansiona</span>
  </button>
  <button id="addBtn" class="dock-btn" aria-label="Aggiungi">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Aggiungi</span>
  </button>
  <button id="moreBtn" class="dock-btn square" aria-label="Altro">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
</nav>

<!-- bottom sheet (contenuto generato da app.js) -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast glass" role="status"></div>

<!-- overlay scanner live (fallback getUserMedia) -->
<div id="scanner">
  <video id="scanVideo" autoplay playsinline muted></video>
  <div class="scan-frame"><span></span></div>
  <div id="scanErr" hidden></div>
  <button class="btn glass-btn scan-cancel" id="scanCancel">Annulla</button>
</div>
